<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Age & BMI Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .container {
            background-color: #1f1f47;
            padding: 30px 40px;
            border-radius: 15px;
            width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        /* Tabs styling */
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(0,0,0,0.2);
            background: rgba(255 255 255 / 0.1);
        }
        .tab {
            flex: 1;
            padding: 12px 0;
            cursor: pointer;
            font-weight: 600;
            user-select: none;
            transition: background-color 0.3s ease;
            color: #ddd;
            letter-spacing: 0.03em;
        }
        .tab.active {
            background: #764ba2;
            color: #fff;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.3);
        }
        .tab:not(.active):hover {
            background: rgba(255 255 255 / 0.15);
        }
        /* Form styles */
        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: 600;
            font-size: 14px;
            text-align: left;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            margin-top: 25px;
            background: #764ba2;
            border: none;
            padding: 12px 0;
            width: 100%;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            color: #fff;
            transition: background-color 0.3s ease;
            box-shadow: 0 3px 12px rgba(118, 75, 162, 0.6);
        }
        button:hover {
            background: #5a367e;
        }
        /* Result box */
        .result {
            margin-top: 30px;
            min-height: 90px;
            font-size: 20px;
            font-weight: 700;
            background: rgba(255 255 255 / 0.15);
            border-radius: 15px;
            padding: 15px 20px;
            color: #ddd;
            user-select: none;
            box-shadow: 0 0 15px rgba(118, 75, 162, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
        }
        .line {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
            gap: 12px;
        }
        .num {
            background: #764ba2;
            color: #fff;
            border-radius: 16px;
            padding: 6px 20px;
            font-weight: 800;
            font-size: 24px;
            min-width: 56px;
            text-align: center;
            box-shadow: 0 0 8px #764ba2;
            font-feature-settings: "tnum";
        }
        /* Spinner styles */
        .spinner {
            display: none;
            margin: 20px auto 0;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid #764ba2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .spinner.active {
            display: block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg);}
            100% { transform: rotate(360deg);}
        }
    </style>
</head>
<body>
    <div class="container" role="main" aria-label="Age and BMI Calculator">
        <h1>Calculator</h1>
        <nav class="tabs" role="tablist">
            <div id="tab-age" class="tab active" role="tab" aria-selected="true" tabindex="0" aria-controls="panel-age" >Age </div>
            <div id="tab-bmi" class="tab" role="tab" aria-selected="false" tabindex="-1" aria-controls="panel-bmi">BMI </div>
        </nav>

        <section id="panel-age" role="tabpanel" aria-labelledby="tab-age">
            <label for="birthdate">Enter your birthdate (DD/MM/YYYY)</label>
            <input type="text" id="birthdate" placeholder="DD/MM/YYYY" maxlength="10" aria-describedby="birthdateHelp" />
            <button id="calcAgeBtn">Calculate Age</button>
            <div class="spinner" id="spinnerAge" aria-hidden="true"></div>
            <div class="result" id="resultAge" aria-live="polite" aria-atomic="true"></div>
        </section>

        <section id="panel-bmi" role="tabpanel" aria-labelledby="tab-bmi" hidden>
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" min="1" max="500" step="0.1" placeholder="e.g. 70.5" aria-describedby="weightHelp" />
            <label for="height">Height (cm)</label>
            <input type="number" id="height" min="30" max="300" step="0.1" placeholder="e.g. 175" aria-describedby="heightHelp" />
            <button id="calcBmiBtn">Calculate BMI</button>
            <div class="spinner" id="spinnerBmi" aria-hidden="true"></div>
            <div class="result" id="resultBmi" aria-live="polite" aria-atomic="true"></div>
        </section>
    </div>

<script>
    /* Tab switching */
    const tabAge = document.getElementById('tab-age');
    const tabBmi = document.getElementById('tab-bmi');
    const panelAge = document.getElementById('panel-age');
    const panelBmi = document.getElementById('panel-bmi');

    function activateTab(tabToActivate) {
        if(tabToActivate === 'age') {
            tabAge.classList.add('active');
            tabAge.setAttribute('aria-selected', 'true');
            tabAge.tabIndex = 0;
            panelAge.removeAttribute('hidden');

            tabBmi.classList.remove('active');
            tabBmi.setAttribute('aria-selected', 'false');
            tabBmi.tabIndex = -1;
            panelBmi.setAttribute('hidden', '');
        } else {
            tabBmi.classList.add('active');
            tabBmi.setAttribute('aria-selected', 'true');
            tabBmi.tabIndex = 0;
            panelBmi.removeAttribute('hidden');

            tabAge.classList.remove('active');
            tabAge.setAttribute('aria-selected', 'false');
            tabAge.tabIndex = -1;
            panelAge.setAttribute('hidden', '');
        }
    }
    tabAge.addEventListener('click', () => activateTab('age'));
    tabBmi.addEventListener('click', () => activateTab('bmi'));

    tabAge.addEventListener('keydown', e => {
        if(e.key === 'ArrowRight' || e.key === 'ArrowDown') {
            e.preventDefault();
            activateTab('bmi');
            tabBmi.focus();
        }
    });
    tabBmi.addEventListener('keydown', e => {
        if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
            e.preventDefault();
            activateTab('age');
            tabAge.focus();
        }
    });

    /* Age Calculator code */
    const birthdateInput = document.getElementById('birthdate');
    const calcAgeBtn = document.getElementById('calcAgeBtn');
    const resultAge = document.getElementById('resultAge');
    const spinnerAge = document.getElementById('spinnerAge');

    function parseDate(str) {
        const parts = str.split('/');
        if(parts.length !== 3) return null;
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        if(isNaN(day) || isNaN(month) || isNaN(year)) return null;
        const date = new Date(year, month, day);
        if(date.getFullYear() !== year ||
           date.getMonth() !== month ||
           date.getDate() !== day) return null;
        return date;
    }

    function calculateAge(birthDate) {
        const today = new Date();
        let years = today.getFullYear() - birthDate.getFullYear();
        let months = today.getMonth() - birthDate.getMonth();
        let days = today.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }
        return { years, months, days };
    }

    calcAgeBtn.addEventListener('click', () => {
        const birthdateValue = birthdateInput.value.trim();
        resultAge.textContent = '';
        if(!birthdateValue) {
            resultAge.textContent = "Please enter your birthdate.";
            return;
        }

        const birthDate = parseDate(birthdateValue);
        if(!birthDate) {
            resultAge.textContent = "Invalid date format or invalid date. Please use DD/MM/YYYY.";
            return;
        }
        if(birthDate > new Date()) {
            resultAge.textContent = "Birthdate cannot be in the future.";
            return;
        }

        spinnerAge.classList.add('active');
        calcAgeBtn.disabled = true;

        setTimeout(() => {
            spinnerAge.classList.remove('active');
            calcAgeBtn.disabled = false;

            const age = calculateAge(birthDate);

            resultAge.innerHTML = `
                <div class="line">Years: <span class="num">${age.years}</span></div>
                <div class="line">Months: <span class="num">${age.months}</span></div>
                <div class="line">Days: <span class="num">${age.days}</span></div>
            `;
        }, 1000);
    });

    /* BMI Calculator code */
    const weightInput = document.getElementById('weight');
    const heightInput = document.getElementById('height');
    const calcBmiBtn = document.getElementById('calcBmiBtn');
    const resultBmi = document.getElementById('resultBmi');
    const spinnerBmi = document.getElementById('spinnerBmi');

    function calculateBMI(weightKg, heightCm) {
        if (heightCm === 0) return null;
        const heightM = heightCm / 100;
        const bmi = weightKg / (heightM * heightM);
        return bmi;
    }

    function getBmiCategory(bmi) {
        if(bmi < 18.5) return "Underweight";
        else if(bmi < 25) return "Normal weight";
        else if(bmi < 30) return "Overweight";
        else return "Obesity";
    }

    calcBmiBtn.addEventListener('click', () => {
        const weight = parseFloat(weightInput.value);
        const height = parseFloat(heightInput.value);
        resultBmi.textContent = '';

        if(isNaN(weight) || weight <= 0) {
            resultBmi.textContent = "Please enter a valid weight (kg).";
            return;
        }
        if(isNaN(height) || height <= 0) {
            resultBmi.textContent = "Please enter a valid height (cm).";
            return;
        }
        spinnerBmi.classList.add('active');
        calcBmiBtn.disabled = true;

        setTimeout(() => {
            spinnerBmi.classList.remove('active');
            calcBmiBtn.disabled = false;

            const bmi = calculateBMI(weight, height);
            if(bmi === null) {
                resultBmi.textContent = "Invalid input data.";
                return;
            }
            const category = getBmiCategory(bmi);
            resultBmi.innerHTML = `
                <div class="line">BMI: <span class="num">${bmi.toFixed(1)}</span></div>
                <div class="line">Category: <span class="num">${category}</span></div>
            `;
        }, 1000);
    });
</script>
</body>
</html>
