<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Data Saver</title>
    <!-- We load the Supabase JavaScript library from a Content Delivery Network (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
            background-color: #f4f4f9;
        }
        .form-container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Contact Form</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="userName">Name</label>
                <input type="text" id="userName" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="userEmail">Email</label>
                <input type="email" id="userEmail" required placeholder="Enter your email">
            </div>
            <button type="submit">Save Data</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // 1. Replace these variables with your actual Supabase credentials
        const SUPABASE_URL = "sb_publishable_Qlf1BmVdHYarOxZJmQh8FQ_BEXFDBtl"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpsaWd4YmJmbXhkbGdsYnBmbnBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MjUwMTAsImV4cCI6MjA5NTIwMTAxMH0.gBw-iewIWW6PUofIo31KWZP7gzvO363LL3UAZzqH4rM";

        // 2. Initialize the Supabase Client
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 3. Select the elements from our HTML
        const form = document.getElementById('contactForm');
        const messageDiv = document.getElementById('message');

        // 4. Listen for when the form is submitted
        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // Prevents the page from refreshing

            // Get the values entered by the user
            const nameValue = document.getElementById('userName').value;
            const emailValue = document.getElementById('userEmail').value;

            messageDiv.style.color = "black";
            messageDiv.innerText = "Saving data...";

            try {
                // Send the data to the 'contacts' table in Supabase
                const { data, error } = await supabaseClient
                    .from('contacts')
                    .insert([
                        { name: nameValue, email: emailValue }
                    ]);

                if (error) {
                    throw error;
                }

                // If successful, show success message and clear form
                messageDiv.style.color = "green";
                messageDiv.innerText = "Data saved successfully!";
                form.reset();

            } catch (err) {
                // If there is an error, display it
                messageDiv.style.color = "red";
                messageDiv.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
